version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowtask-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowtask
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowtask-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowtask-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowtask.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - flowtask-network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  flowtask-network:
    driver: bridge

