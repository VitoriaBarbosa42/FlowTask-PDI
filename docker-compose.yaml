version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flowtask-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowtask
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flowtask-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flowtask-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flowtask.com
      PGADMIN_DEFAULT_PASSWORD: admin
    networks:
      - flowtask-network
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: flowtask-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/flowtask_keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-config/flowtask-realm.json:/opt/keycloak/data/import/flowtask-realm.json
    command: start-dev --import-realm
    depends_on:
      - postgres
    networks:
      - flowtask-network

volumes:
  postgres_data:

networks:
  flowtask-network:
    driver: bridge

